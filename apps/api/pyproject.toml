[project]
name = "personal-os-api"
version = "0.1.0"
description = "Personal OS Core API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "pgvector>=0.3.0",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    "cryptography>=42.0",  # AES-256-GCM for stored integration secrets
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
    "telethon>=1.36,<2",
]

[dependency-groups]
# Installed by `uv sync` (CI, local), skipped by `uv sync --no-dev` (Docker images).
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "--cov=src --cov-report=term"
markers = [
    "staging: marks tests as staging E2E tests requiring live environment or staging credentials",
    "external: marks tests making real HTTP requests to external third-party APIs (Telegram, Google)",
]


