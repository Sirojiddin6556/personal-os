version: '3.9'

# Celery Beat Scheduler + доп. worker
services:
  scheduler:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    command: celery -A src.worker beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      - redis
      - postgres
  
  flower:
    image: mher/flower:2.0
    command: celery flower --broker=${REDIS_URL}
    ports:
      - "5555:5555"
    depends_on:
      - redis
