name: CD
on:
  push:
    branches: [master]
    tags: ['v*']

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [] # после CI
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push Docker images
        run: |
          docker build -t ghcr.io/${{ github.repository }}/api:${{ github.sha }} apps/api/
          docker build -t ghcr.io/${{ github.repository }}/web:${{ github.sha }} apps/web/
          docker push ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/web:${{ github.sha }}
      - name: Deploy (ssh + docker compose pull + up)
        run: |
          # ssh deploy script placeholder
          echo "Deploy image ${{ github.sha }}"
