name: Web + Mini App → GitHub Pages

# https://<owner>.github.io/<repo>/     → web app (Next.js static export)
# https://<owner>.github.io/<repo>/tg/  → Telegram Mini App
on:
  push:
    branches: [master]
    paths: ['apps/web/**', 'apps/tg-miniapp/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  BASE_PATH: /${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require API URL
        run: |
          if [ -z "${{ vars.API_URL }}" ]; then
            echo "::error::Set repository variable API_URL, e.g. https://personal-os-api.onrender.com/v1"
            exit 1
          fi
          api="${{ vars.API_URL }}"
          echo "API_URL=${api%/}" >> "$GITHUB_ENV"
          ws="${api%/}/ws"; echo "WS_URL=${ws/https:/wss:}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/tg-miniapp/package-lock.json

      - name: Build web app
        working-directory: apps/web
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: ${{ env.BASE_PATH }}
          NEXT_PUBLIC_API_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ env.WS_URL }}
        run: |
          npm ci
          npm run build

      - name: Build Mini App
        working-directory: apps/tg-miniapp
        env:
          VITE_BASE: ${{ env.BASE_PATH }}/tg/
          VITE_API_BASE: ${{ env.API_URL }}
        run: |
          npm ci
          npm test
          npm run build

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r apps/web/out/. site/
          mkdir -p site/tg
          cp -r apps/tg-miniapp/dist/. site/tg/
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
