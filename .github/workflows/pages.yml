name: Mini App → GitHub Pages

on:
  push:
    branches: [master]
    paths: ['apps/tg-miniapp/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tg-miniapp
    steps:
      - uses: actions/checkout@v4
      - name: Require API URL
        run: |
          if [ -z "${{ vars.MINIAPP_API_URL }}" ]; then
            echo "::error::Set repository variable MINIAPP_API_URL, e.g. https://personal-os-api.onrender.com/v1"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/tg-miniapp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ vars.MINIAPP_API_URL }}
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/tg-miniapp/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
