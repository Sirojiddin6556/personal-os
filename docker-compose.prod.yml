version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: personal_os_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - web
      - api
    networks:
      - personal_os_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  web:
    image: ghcr.io/sirojiddin6556/personal-os-web:${TAG:-latest}
    container_name: personal_os_web
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://app.personal-os.com/api
      - NEXT_PUBLIC_WS_URL=wss://app.personal-os.com/v1/ws
    networks:
      - personal_os_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G

  api:
    image: ghcr.io/sirojiddin6556/personal-os-api:${TAG:-latest}
    container_name: personal_os_api
    restart: always
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - personal_os_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  celery_worker:
    image: ghcr.io/sirojiddin6556/personal-os-api:${TAG:-latest}
    container_name: personal_os_celery_worker
    restart: always
    command: ["celery", "-A", "src.shared.celery_app", "worker", "--loglevel=info", "-c", "4"]
    env_file:
      - .env.production
    depends_on:
      - api
      - redis
    networks:
      - personal_os_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  celery_beat:
    image: ghcr.io/sirojiddin6556/personal-os-api:${TAG:-latest}
    container_name: personal_os_celery_beat
    restart: always
    command: ["celery", "-A", "src.shared.celery_app", "beat", "--loglevel=info"]
    env_file:
      - .env.production
    depends_on:
      - api
      - redis
    networks:
      - personal_os_net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: personal_os_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_os_prod}
      POSTGRES_USER: ${POSTGRES_USER:-pos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./deploy/postgres/init-ssl.sh:/docker-entrypoint-initdb.d/init-ssl.sh:ro
    networks:
      - personal_os_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos_admin} -d ${POSTGRES_DB:-personal_os_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G

  redis:
    image: redis:7-alpine
    container_name: personal_os_redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata_prod:/data
    networks:
      - personal_os_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  personal_os_net:
    driver: bridge

volumes:
  pgdata_prod:
  redisdata_prod:
