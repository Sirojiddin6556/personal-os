# One public hostname (via Cloudflare Tunnel):
#   /        -> web app (static Next.js export)
#   /tg/     -> Telegram Mini App
#   /api/    -> FastAPI (prefix stripped: /api/v1/... -> /v1/...)
#   /v1/ws   -> FastAPI WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream pos_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # Cloudflare terminates TLS; keep the real client IP for logs/rate limits.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://pos_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /v1/ws {
        proxy_pass http://pos_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Telegram Mini App (opened inside Telegram, also in web.telegram.org iframes)
    location /tg/assets/ {
        alias /usr/share/nginx/html/tg/assets/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /tg/ {
        alias /usr/share/nginx/html/tg/;
        try_files $uri $uri/ /tg/index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://*.telegram.org" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Web app (trailingSlash export: /today/ -> today/index.html)
    location / {
        root /usr/share/nginx/html/web;
        try_files $uri $uri/ $uri.html =404;
        error_page 404 /404.html;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        location /_next/static/ {
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
