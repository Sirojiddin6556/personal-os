global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  receiver: 'telegram-ops'
  routes:
    - match:
        severity: critical
      receiver: 'pagerduty-and-telegram'

receivers:
  - name: 'telegram-ops'
    telegram_configs:
      - bot_token: '${TELEGRAM_OPS_BOT_TOKEN}'
        chat_id: -1001234567890
        send_resolved: true
        parse_mode: 'HTML'

  - name: 'pagerduty-and-telegram'
    telegram_configs:
      - bot_token: '${TELEGRAM_OPS_BOT_TOKEN}'
        chat_id: -1001234567890
        send_resolved: true
        parse_mode: 'HTML'
